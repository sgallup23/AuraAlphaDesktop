name: Build & Release Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build grid worker binary
        run: |
          cd grid_worker
          pip install pyinstaller numpy polars psutil
          pyinstaller --onefile --name aura-grid-worker --clean --noconfirm --hidden-import=numpy --hidden-import=polars --hidden-import=psutil --collect-all polars worker.py

      - name: Place grid worker sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          cp grid_worker/dist/aura-grid-worker src-tauri/binaries/aura-grid-worker-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/aura-grid-worker-x86_64-unknown-linux-gnu

      - name: Place grid worker sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          cp grid_worker/dist/aura-grid-worker.exe src-tauri/binaries/aura-grid-worker-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Place grid worker sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries
          cp grid_worker/dist/aura-grid-worker src-tauri/binaries/aura-grid-worker-aarch64-apple-darwin
          chmod +x src-tauri/binaries/aura-grid-worker-aarch64-apple-darwin

      # ── Windows code signing: sign grid worker sidecar before bundling ──
      - name: Sign grid worker (Windows)
        if: matrix.platform == 'windows-latest' && secrets.WINDOWS_CERT_PFX != ''
        continue-on-error: true
        shell: powershell
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX }}")
          [IO.File]::WriteAllBytes("cert.pfx", $pfxBytes)
          & signtool sign /f cert.pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /tr http://ts.ssl.com /td sha256 /fd sha256 "src-tauri\binaries\aura-grid-worker-x86_64-pc-windows-msvc.exe"
          Remove-Item cert.pfx

      # ── macOS code signing: sign grid worker sidecar before bundling ──
      - name: Sign grid worker (macOS)
        if: matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY != ''
        continue-on-error: true
        run: |
          codesign --force --options runtime --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            src-tauri/binaries/aura-grid-worker-aarch64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      # ── Build Tauri app with updater signing + platform-specific code signing ──
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (all platforms)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (tauri-action handles these automatically)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aura Alpha v__VERSION__'
          releaseBody: |
            ## Aura Alpha v4.0.0 — Hedge AI

            ### New
            - Intelligence Dashboard panel (30+ years of market data)
            - Market Regime panel (VIX history, regime transitions)
            - Portfolio Brain panel (cross-bot exposure tracking)
            - Grid Compute panel (distributed compute monitoring)
            - Code signed on Windows (SSL.com OV) and macOS (Apple notarized)

            ### Fixed
            - Windows SmartScreen now shows publisher name
            - macOS Gatekeeper no longer blocks installation
            - Auto-updater signing for secure updates

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: false

      # ── Windows: sign the final installer artifacts after bundling ──
      - name: Sign Windows installer
        if: matrix.platform == 'windows-latest' && secrets.WINDOWS_CERT_PFX != ''
        continue-on-error: true
        shell: powershell
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX }}")
          [IO.File]::WriteAllBytes("cert.pfx", $pfxBytes)
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.exe","*.msi" | ForEach-Object {
            Write-Host "Signing $($_.FullName)"
            & signtool sign /f cert.pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /tr http://ts.ssl.com /td sha256 /fd sha256 $_.FullName
          }
          Remove-Item cert.pfx
