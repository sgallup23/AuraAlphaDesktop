name: Build & Release Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Detect which signing secrets are available ──
      - name: Check signing secrets
        id: signing
        shell: bash
        run: |
          if [ -n "$APPLE_CERT" ]; then
            echo "has_apple_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apple_cert=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$WIN_CERT" ]; then
            echo "has_windows_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_windows_cert=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX }}

      - name: Build grid worker binary
        run: |
          cd grid_worker
          pip install pyinstaller numpy polars psutil
          pyinstaller --onefile --name aura-grid-worker --clean --noconfirm --hidden-import=numpy --hidden-import=polars --hidden-import=psutil --collect-all polars worker.py

      - name: Place grid worker sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          cp grid_worker/dist/aura-grid-worker src-tauri/binaries/aura-grid-worker-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/aura-grid-worker-x86_64-unknown-linux-gnu

      - name: Place grid worker sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          cp grid_worker/dist/aura-grid-worker.exe src-tauri/binaries/aura-grid-worker-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Place grid worker sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries
          cp grid_worker/dist/aura-grid-worker src-tauri/binaries/aura-grid-worker-aarch64-apple-darwin
          chmod +x src-tauri/binaries/aura-grid-worker-aarch64-apple-darwin

      # ── Windows code signing: sign grid worker sidecar before bundling ──
      - name: Sign grid worker (Windows)
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        continue-on-error: true
        shell: powershell
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX }}")
          [IO.File]::WriteAllBytes("cert.pfx", $pfxBytes)
          & signtool sign /f cert.pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /tr http://ts.ssl.com /td sha256 /fd sha256 "src-tauri\binaries\aura-grid-worker-x86_64-pc-windows-msvc.exe"
          Remove-Item cert.pfx

      # ── macOS code signing: sign grid worker sidecar before bundling ──
      - name: Sign grid worker (macOS)
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.has_apple_cert == 'true'
        continue-on-error: true
        run: |
          codesign --force --options runtime --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            src-tauri/binaries/aura-grid-worker-aarch64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      # ── Build Tauri app WITH Apple code signing (when cert is available) ──
      - name: Build Tauri app (macOS signed)
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.has_apple_cert == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aura Alpha v__VERSION__'
          releaseBody: |
            ## Aura Alpha — Hedge AI: Intelligence Engine + Signed Builds

            ### New in v4
            - Intelligence Dashboard panel (30+ years of market data)
            - Market Regime panel (VIX history, regime transitions)
            - Portfolio Brain panel (cross-bot exposure tracking)
            - Grid Compute panel (distributed compute monitoring)
            - Settings panel with API key management
            - Tauri updater signing for secure auto-updates

            ### Code Signing
            - Windows: SSL.com OV certificate (SmartScreen verified)
            - macOS: Apple Developer notarized (Gatekeeper approved)
            - Tauri updater: Ed25519 signature verification

            ### Fixed
            - CI builds all three platforms (Linux, Windows, macOS)
            - Rust warnings resolved (unused imports)
            - Version strings synchronized across all config files

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: false

      # ── Build Tauri app WITHOUT Apple code signing (macOS unsigned or non-macOS) ──
      - name: Build Tauri app
        if: matrix.platform != 'macos-latest' || steps.signing.outputs.has_apple_cert != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aura Alpha v__VERSION__'
          releaseBody: |
            ## Aura Alpha — Hedge AI: Intelligence Engine + Signed Builds

            ### New in v4
            - Intelligence Dashboard panel (30+ years of market data)
            - Market Regime panel (VIX history, regime transitions)
            - Portfolio Brain panel (cross-bot exposure tracking)
            - Grid Compute panel (distributed compute monitoring)
            - Settings panel with API key management
            - Tauri updater signing for secure auto-updates

            ### Code Signing
            - Windows: SSL.com OV certificate (SmartScreen verified)
            - macOS: Apple Developer notarized (Gatekeeper approved)
            - Tauri updater: Ed25519 signature verification

            ### Fixed
            - CI builds all three platforms (Linux, Windows, macOS)
            - Rust warnings resolved (unused imports)
            - Version strings synchronized across all config files

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: false

      # ── Windows: sign the final installer artifacts after bundling ──
      - name: Sign Windows installer
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        continue-on-error: true
        shell: powershell
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX }}")
          [IO.File]::WriteAllBytes("cert.pfx", $pfxBytes)
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.exe","*.msi" | ForEach-Object {
            Write-Host "Signing $($_.FullName)"
            & signtool sign /f cert.pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /tr http://ts.ssl.com /td sha256 /fd sha256 $_.FullName
          }
          Remove-Item cert.pfx
