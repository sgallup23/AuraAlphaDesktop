name: Build & Release Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Detect which signing secrets are available ──
      - name: Check signing secrets
        id: signing
        shell: bash
        run: |
          if [ -n "$APPLE_CERT" ]; then
            echo "has_apple_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apple_cert=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$WIN_USER" ] && [ -n "$WIN_CRED" ] && [ -n "$WIN_TOTP" ]; then
            echo "has_windows_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_windows_cert=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          WIN_USER: ${{ secrets.SSLCOM_USERNAME }}
          WIN_CRED: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          WIN_TOTP: ${{ secrets.SSLCOM_TOTP_SECRET }}

      - name: Build grid worker binary
        run: |
          cd grid_worker
          pip install pyinstaller numpy polars psutil
          pyinstaller --onefile --noconsole --name aura-grid-worker --clean --noconfirm --hidden-import=numpy --hidden-import=polars --hidden-import=psutil --collect-all polars worker.py

      - name: Place grid worker sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          cp grid_worker/dist/aura-grid-worker src-tauri/binaries/aura-grid-worker-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/aura-grid-worker-x86_64-unknown-linux-gnu

      - name: Place grid worker sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          cp grid_worker/dist/aura-grid-worker.exe src-tauri/binaries/aura-grid-worker-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Place grid worker sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries
          cp grid_worker/dist/aura-grid-worker src-tauri/binaries/aura-grid-worker-aarch64-apple-darwin
          chmod +x src-tauri/binaries/aura-grid-worker-aarch64-apple-darwin

      # ── Windows code signing: install CodeSignTool + sign grid worker sidecar ──
      - name: Install CodeSignTool (Windows)
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        shell: bash
        run: |
          curl -sL -o CodeSignTool.zip https://www.ssl.com/download/codesigntool-for-windows/
          unzip -o CodeSignTool.zip -d /tmp/cst || true
          CST_DIR=$(find /tmp/cst -name "CodeSignTool.bat" -exec dirname {} \; | head -1)
          echo "CST_DIR=$CST_DIR" >> "$GITHUB_ENV"

      - name: Sign grid worker (Windows)
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          "$CST_DIR/CodeSignTool.bat" sign \
            -username="${{ secrets.SSLCOM_USERNAME }}" \
            -password="${{ secrets.SSLCOM_PASSWORD }}" \
            -credential_id="${{ secrets.SSLCOM_CREDENTIAL_ID }}" \
            -totp_secret="${{ secrets.SSLCOM_TOTP_SECRET }}" \
            -input_file_path="src-tauri/binaries/aura-grid-worker-x86_64-pc-windows-msvc.exe" \
            -override=true

      # ── macOS code signing: sign grid worker sidecar before bundling ──
      - name: Sign grid worker (macOS)
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.has_apple_cert == 'true'
        continue-on-error: true
        run: |
          codesign --force --options runtime --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            src-tauri/binaries/aura-grid-worker-aarch64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      # ── Build Tauri app WITH Apple code signing (when cert is available) ──
      - name: Build Tauri app (macOS signed)
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.has_apple_cert == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aura Alpha v__VERSION__'
          releaseBody: |
            Three live trading bots. Thirty years of market intelligence. Distributed research computing.
            This is the same system we use to manage real capital — and now it's yours.

            ### What's in v4.2.0

            **Intelligence Engine (all panels now live)**
            - Intelligence Dashboard: real-time VIX, Fear & Greed Index, HMM-detected market regime (data back to 1993)
            - Regime Panel: per-market regime distribution + VIX transition history across 8 global markets
            - Meta Allocator: AI-driven capital allocation — adjusts for VIX level, regime, sector rotation, news sentiment
            - Portfolio Brain: cross-bot exposure tracking, conflict detection, sector breakdown

            **Live Trading**
            - 3 active bots: SHAWN (equity day-trade), SHANE (equity swing), Nova (crypto 24/7)
            - 83 strategies across 14 regions, 713 symbols
            - 47 brokers supported (127+ effective venues via MT5 bridge)

            **Research Grid**
            - Distributed backtesting: 200,000+ completed research jobs
            - Contribute your idle CPU, help discover the next edge
            - Real-time queue depth + throughput monitoring

            **New Default Layout**
            - Intelligence Dashboard is front and center on first launch
            - Grid Compute visible immediately (see research happening in real time)
            - All 16 panels accessible, organized for progressive discovery

            ### Code Signing
            - Windows: SSL.com OV certificate — installs without SmartScreen warning
            - macOS: Apple Developer notarized — opens without Gatekeeper prompt
            - Auto-updates: Ed25519 signed for tamper-proof delivery

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: false

      # ── Build Tauri app WITHOUT Apple code signing (macOS unsigned or non-macOS) ──
      - name: Build Tauri app
        if: matrix.platform != 'macos-latest' || steps.signing.outputs.has_apple_cert != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aura Alpha v__VERSION__'
          releaseBody: |
            Three live trading bots. Thirty years of market intelligence. Distributed research computing.
            This is the same system we use to manage real capital — and now it's yours.

            ### What's in v4.2.0

            **Intelligence Engine (all panels now live)**
            - Intelligence Dashboard: real-time VIX, Fear & Greed Index, HMM-detected market regime (data back to 1993)
            - Regime Panel: per-market regime distribution + VIX transition history across 8 global markets
            - Meta Allocator: AI-driven capital allocation — adjusts for VIX level, regime, sector rotation, news sentiment
            - Portfolio Brain: cross-bot exposure tracking, conflict detection, sector breakdown

            **Live Trading**
            - 3 active bots: SHAWN (equity day-trade), SHANE (equity swing), Nova (crypto 24/7)
            - 83 strategies across 14 regions, 713 symbols
            - 47 brokers supported (127+ effective venues via MT5 bridge)

            **Research Grid**
            - Distributed backtesting: 200,000+ completed research jobs
            - Contribute your idle CPU, help discover the next edge
            - Real-time queue depth + throughput monitoring

            **New Default Layout**
            - Intelligence Dashboard is front and center on first launch
            - Grid Compute visible immediately (see research happening in real time)
            - All 16 panels accessible, organized for progressive discovery

            ### Code Signing
            - Windows: SSL.com OV certificate — installs without SmartScreen warning
            - macOS: Apple Developer notarized — opens without Gatekeeper prompt
            - Auto-updates: Ed25519 signed for tamper-proof delivery

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: false

      # ── Windows: sign the final installer artifacts after bundling ──
      - name: Sign Windows MSI installer
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          for msi in src-tauri/target/release/bundle/msi/*.msi; do
            echo "Signing $msi..."
            "$CST_DIR/CodeSignTool.bat" sign \
              -username="${{ secrets.SSLCOM_USERNAME }}" \
              -password="${{ secrets.SSLCOM_PASSWORD }}" \
              -credential_id="${{ secrets.SSLCOM_CREDENTIAL_ID }}" \
              -totp_secret="${{ secrets.SSLCOM_TOTP_SECRET }}" \
              -input_file_path="$msi" \
              -override=true
          done

      - name: Sign Windows NSIS installer
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          for exe in src-tauri/target/release/bundle/nsis/*.exe; do
            echo "Signing $exe..."
            "$CST_DIR/CodeSignTool.bat" sign \
              -username="${{ secrets.SSLCOM_USERNAME }}" \
              -password="${{ secrets.SSLCOM_PASSWORD }}" \
              -credential_id="${{ secrets.SSLCOM_CREDENTIAL_ID }}" \
              -totp_secret="${{ secrets.SSLCOM_TOTP_SECRET }}" \
              -input_file_path="$exe" \
              -override=true
          done

      - name: Verify no update.auraalpha.cc references
        run: |
          if grep -r "update.auraalpha.cc" --include="*.py" --include="*.rs" --include="*.json" --include="*.js" --include="*.jsx" --include="*.ts" . | grep -v node_modules | grep -v target | grep -v .git; then
            echo "ERROR: Found update.auraalpha.cc references. Use auraalpha.cc instead."
            exit 1
          fi
          echo "Clean — no update.auraalpha.cc references found"
