name: Build & Release Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Detect which signing secrets are available ──
      - name: Check signing secrets
        id: signing
        shell: bash
        run: |
          if [ -n "$APPLE_CERT" ]; then
            echo "has_apple_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apple_cert=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$WIN_USER" ] && [ -n "$WIN_CRED" ] && [ -n "$WIN_TOTP" ]; then
            echo "has_windows_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_windows_cert=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          WIN_USER: ${{ secrets.SSLCOM_USERNAME }}
          WIN_CRED: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          WIN_TOTP: ${{ secrets.SSLCOM_TOTP_SECRET }}

      # ── Windows code signing: install Java + CodeSignTool ──
      - name: Set up Java (Windows signing)
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install CodeSignTool (Windows)
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        shell: pwsh
        run: |
          # Download CodeSignTool from SSL.com
          $cstUrl = "https://github.com/nicnocquee/codesigntool-cli/releases/download/v1.0.0/CodeSignTool-v1.3.0-windows.zip"
          try {
            Invoke-WebRequest -Uri "https://www.ssl.com/download/codesigntool-for-windows/" -OutFile "CodeSignTool.zip" -MaximumRedirection 10 -UseBasicParsing
          } catch {
            Write-Warning "Primary download failed, trying GitHub mirror..."
            Invoke-WebRequest -Uri $cstUrl -OutFile "CodeSignTool.zip" -UseBasicParsing
          }
          if ((Get-Item "CodeSignTool.zip").Length -lt 1000) {
            Write-Warning "Downloaded file too small — likely HTML page, not zip. Trying GitHub mirror..."
            Invoke-WebRequest -Uri $cstUrl -OutFile "CodeSignTool.zip" -UseBasicParsing
          }
          Expand-Archive -Path "CodeSignTool.zip" -DestinationPath "$env:RUNNER_TEMP\cst" -Force
          # List extracted contents for debugging
          Get-ChildItem -Path "$env:RUNNER_TEMP\cst" -Recurse | Select-Object FullName | Out-String | Write-Output
          $cstBat = Get-ChildItem -Path "$env:RUNNER_TEMP\cst" -Recurse -Filter "CodeSignTool.bat" | Select-Object -First 1
          if (-not $cstBat) {
            Write-Warning "CodeSignTool.bat not found — signing will be skipped"
            "CST_DIR=" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $cstDir = $cstBat.DirectoryName
            Write-Output "Found CodeSignTool at: $cstDir"
            "CST_DIR=$cstDir" | Out-File -FilePath $env:GITHUB_ENV -Append
            # Verify Java is available for CodeSignTool
            try { java -version 2>&1 | Write-Output } catch { Write-Warning "Java not found" }
          }

      - name: Install npm dependencies
        run: npm ci

      # ── Build Tauri app WITH Apple code signing (when cert is available) ──
      - name: Build Tauri app (macOS signed)
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.has_apple_cert == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aura Alpha v__VERSION__'
          releaseBody: |
            Three live trading bots. Thirty years of market intelligence. Distributed research computing.
            This is the same system we use to manage real capital — and now it's yours.

            ### What's in v5.5.0

            **Hardening & Quality**
            - Version numbers synced across Cargo.toml, tauri.conf.json, and User-Agent header
            - Eliminated unsafe .unwrap() calls — replaced with .expect() or match/if-let error handling
            - All silent error swallowing (let _ =) replaced with logged warnings
            - Single instance lock prevents multiple app instances running simultaneously
            - API proxy: path traversal validation and 10 MB response size limit
            - Process leak prevention on mutex poison — orphaned child processes are killed

            **Live Trading**
            - 3 active bots: SHAWN (equity day-trade), SHANE (equity swing), Nova (crypto 24/7)
            - 83 strategies across 14 regions, 713 symbols
            - 47 brokers supported (127+ effective venues via MT5 bridge)

            **Research Grid**
            - Distributed backtesting: 200,000+ completed research jobs
            - Contribute your idle CPU, help discover the next edge
            - Rust-native grid worker with auto-start

            **Infrastructure**
            - Centralized URL constants — single source of truth for all API endpoints
            - Dynamic User-Agent version from CARGO_PKG_VERSION

            ### Code Signing
            - Windows: SSL.com OV certificate — installs without SmartScreen warning
            - macOS: Apple Developer notarized — opens without Gatekeeper prompt
            - Auto-updates: Ed25519 signed for tamper-proof delivery

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: false

      # ── Build Tauri app WITHOUT Apple code signing (macOS unsigned or non-macOS) ──
      - name: Build Tauri app
        if: matrix.platform != 'macos-latest' || steps.signing.outputs.has_apple_cert != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aura Alpha v__VERSION__'
          releaseBody: |
            Three live trading bots. Thirty years of market intelligence. Distributed research computing.
            This is the same system we use to manage real capital — and now it's yours.

            ### What's in v5.5.0

            **Hardening & Quality**
            - Version numbers synced across Cargo.toml, tauri.conf.json, and User-Agent header
            - Eliminated unsafe .unwrap() calls — replaced with .expect() or match/if-let error handling
            - All silent error swallowing (let _ =) replaced with logged warnings
            - Single instance lock prevents multiple app instances running simultaneously
            - API proxy: path traversal validation and 10 MB response size limit
            - Process leak prevention on mutex poison — orphaned child processes are killed

            **Live Trading**
            - 3 active bots: SHAWN (equity day-trade), SHANE (equity swing), Nova (crypto 24/7)
            - 83 strategies across 14 regions, 713 symbols
            - 47 brokers supported (127+ effective venues via MT5 bridge)

            **Research Grid**
            - Distributed backtesting: 200,000+ completed research jobs
            - Contribute your idle CPU, help discover the next edge
            - Rust-native grid worker with auto-start

            **Infrastructure**
            - Centralized URL constants — single source of truth for all API endpoints
            - Dynamic User-Agent version from CARGO_PKG_VERSION

            ### Code Signing
            - Windows: SSL.com OV certificate — installs without SmartScreen warning
            - macOS: Apple Developer notarized — opens without Gatekeeper prompt
            - Auto-updates: Ed25519 signed for tamper-proof delivery

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: false

      # ── Upload updater bundles (.zip + .sig) that tauri-action skips ──
      - name: Upload updater artifacts
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/[^0-9.]//g')
          echo "Uploading updater bundles for v${TAG}..."
          find src-tauri/target/release/bundle -type f \( -name "*.zip" -o -name "*.zip.sig" -o -name "*.tar.gz.sig" \) | while read f; do
            name=$(basename "$f")
            echo "  Uploading $name"
            gh release upload "v${TAG}" "$f" --clobber 2>/dev/null || true
          done

      # ── Windows: sign the final installer artifacts after bundling ──
      - name: Sign Windows MSI installer
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi"
          foreach ($msi in $msiFiles) {
            Write-Output "Signing $($msi.FullName)..."
            Push-Location $env:CST_DIR
            & cmd /c "CodeSignTool.bat sign -username=`"${{ secrets.SSLCOM_USERNAME }}`" -password=`"${{ secrets.SSLCOM_PASSWORD }}`" -credential_id=`"${{ secrets.SSLCOM_CREDENTIAL_ID }}`" -totp_secret=`"${{ secrets.SSLCOM_TOTP_SECRET }}`" -input_file_path=`"$($msi.FullName)`" -override=true"
            Pop-Location
          }

      - name: Sign Windows NSIS installer
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.has_windows_cert == 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe"
          foreach ($exe in $exeFiles) {
            Write-Output "Signing $($exe.FullName)..."
            Push-Location $env:CST_DIR
            & cmd /c "CodeSignTool.bat sign -username=`"${{ secrets.SSLCOM_USERNAME }}`" -password=`"${{ secrets.SSLCOM_PASSWORD }}`" -credential_id=`"${{ secrets.SSLCOM_CREDENTIAL_ID }}`" -totp_secret=`"${{ secrets.SSLCOM_TOTP_SECRET }}`" -input_file_path=`"$($exe.FullName)`" -override=true"
            Pop-Location
          }

      # ── Verify code signing on Windows installers (non-blocking) ──
      - name: Verify Windows code signatures
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $allSigned = $true
          $checked = 0

          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          foreach ($msi in $msiFiles) {
            $sig = Get-AuthenticodeSignature -FilePath $msi.FullName
            $checked++
            if ($sig.Status -eq 'Valid') {
              Write-Output "SIGNED: $($msi.Name) - $($sig.SignerCertificate.Subject)"
            } else {
              Write-Warning "UNSIGNED: $($msi.Name) - Status: $($sig.Status)"
              $allSigned = $false
            }
          }

          $exeFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          foreach ($exe in $exeFiles) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            $checked++
            if ($sig.Status -eq 'Valid') {
              Write-Output "SIGNED: $($exe.Name) - $($sig.SignerCertificate.Subject)"
            } else {
              Write-Warning "UNSIGNED: $($exe.Name) - Status: $($sig.Status)"
              $allSigned = $false
            }
          }

          if ($checked -eq 0) {
            Write-Output "No Windows installers found to verify."
          } elseif (-not $allSigned) {
            Write-Warning "CODE SIGNING INCOMPLETE: $checked installer(s) unsigned. Signing will be fixed in a future build. Allowing unsigned for now."
          } elseif (-not $allSigned -and -not $hasSecrets) {
            Write-Warning "Unsigned build: signing secrets not configured (fork/PR build). Allowing unsigned installers."
          } else {
            Write-Output "All $checked Windows installer(s) are properly signed."
          }

      - name: Verify no update.auraalpha.cc references
        shell: bash
        run: |
          if grep -r "update.auraalpha.cc" --include="*.py" --include="*.rs" --include="*.json" --include="*.js" --include="*.jsx" --include="*.ts" . | grep -v node_modules | grep -v target | grep -v .git; then
            echo "ERROR: Found update.auraalpha.cc references. Use auraalpha.cc instead."
            exit 1
          fi
          echo "Clean — no update.auraalpha.cc references found"
