[package]
name = "aura-alpha-desktop"
version = "7.3.0"
description = "Aura Alpha Trading Desk"
authors = ["Aura Alpha"]
edition = "2021"

[lib]
name = "aura_alpha_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
dirs = "5"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"
hostname = "0.4"
keyring = "3"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
rayon = "1.10"
polars = { version = "0.46", features = ["parquet", "csv", "lazy", "dtype-date", "dtype-datetime"] }
smartcore = { version = "0.4", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"], optional = true }

[features]
default = ["gpu"]
gpu = ["wgpu"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
