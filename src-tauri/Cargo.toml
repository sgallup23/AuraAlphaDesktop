[package]
name = "aura-alpha-desktop"
version = "7.4.0"
description = "Aura Alpha Trading Desk"
authors = ["Aura Alpha"]
edition = "2021"

[lib]
name = "aura_alpha_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "signal"] }
dirs = "5"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"
hostname = "0.4"
keyring = "3"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
rayon = "1.10"
polars = { version = "0.46", features = ["parquet", "csv", "lazy", "cloud"] }
lru = "0.12"
smartcore = { version = "0.4", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
redis = { version = "0.27", features = ["tokio-comp"] }
uuid = { version = "1", features = ["v4"] }
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"], optional = true }

[features]
default = []
gpu = ["wgpu"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"      # optimize for size
lto = true           # link-time optimization
codegen-units = 1    # single codegen unit for better optimization
strip = true         # strip debug symbols
panic = "abort"      # smaller binary, no unwinding
