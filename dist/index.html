    #root { background: #0D1117; min-height: 100vh; }
    #preload {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0D1117;
    }
    #preload .logo {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg, #58A6FF, #BC8CFF, #3FB950);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 24px; font-weight: bold;
      animation: pulse 1.5s ease-in-out infinite;
    }
    #preload .status { margin-top: 16px; font-size: 13px; color: #8B949E; }
    #preload .error { margin-top: 12px; font-size: 12px; color: #F85149; max-width: 400px; text-align: center; display: none; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
